# Compiles the app for iPhone (simulator) and Mac without signing, on every push to a branch. Free on this public
# repo, and it catches the type errors the Linux parse check can't, before a TestFlight build.
name: Build

on:
  push:
    paths: ["apps/**", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS Simulator", "platform=macOS"]
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] || { echo "No Xcode 26 or newer on this Mac"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Make the Xcode project
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          DEVELOPMENT_TEAM="" /tmp/xg/xcodegen/bin/xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project ReaderCount.xcodeproj -scheme ReaderCount -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | grep -E "error:|warning: unused|BUILD (SUCCEEDED|FAILED)" || true
          xcodebuild build -project ReaderCount.xcodeproj -scheme ReaderCount -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
